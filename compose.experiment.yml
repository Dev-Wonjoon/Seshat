name: seshat-experiment

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    mem_limit: 4g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  central:
    build: .
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATASOURCE_URL: "jdbc:sqlite:/var/lib/seshat/queue.db?journal_mode=WAL&synchronous=FULL&busy_timeout=5000"
      SESHAT_QUEUE_WORKER_ENABLED: "true"
      SESHAT_REPAIR_ENABLED: "false"
    ports:
      - "${SESHAT_PRIVATE_IP:?Set SESHAT_PRIVATE_IP}:8080:8080"
    volumes:
      - sqlite-data:/var/lib/seshat
    restart: unless-stopped
    env_file:
      - /etc/seshat/demo.env

  web:
    build: ../papyrus
    ports:
      - "127.0.0.1:5000:80"
    restart: unless-stopped

volumes:
  elasticsearch-data:
  sqlite-data:
