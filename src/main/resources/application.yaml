spring:
  application:
    name: seshat

  elasticsearch:
    uris: http://127.0.0.1:9200

  datasource:
    url: "jdbc:sqlite:./seshat-queue.db?journal_mode=WAL&synchronous=FULL&busy_timeout=5000"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

seshat:
  ingestion:
    max-request-bytes: 1048576

  queue:
    worker-enabled: false
    worker-delay-ms: 1000

  repair:
    enabled: "${SESHAT_REPAIR_ENABLED:false}"
    scheduler-enabled: true
    provider: "${SESHAT_REPAIR_PROVIDER:openAiCompatibleRepair}"
    poll-delay-ms: 1000
    timeout-ms: 5000
    max-attempts: 3
    retry-delay-ms: 1000
    http:
      endpoint: "${SESHAT_REPAIR_HTTP_ENDPOINT:}"
      model: "${SESHAT_REPAIR_HTTP_MODEL:}"
      api-key: "${SESHAT_REPAIR_HTTP_API_KEY:}"
