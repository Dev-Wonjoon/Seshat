plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

springBoot {
	mainClass = 'com.seshat.SeshatApplication'
}

def windowsHost = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows')

tasks.register('runAgent', JavaExec) {
	dependsOn classes
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.seshat.agent.AgentMain'
	if (windowsHost) {
		jvmArgs '--enable-native-access=ALL-UNNAMED'
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'commons-io:commons-io:2.22.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.xerial:sqlite-jdbc'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	if (windowsHost) {
		jvmArgs '--enable-native-access=ALL-UNNAMED'
	}
}

configurations {
	agentRuntimeClasspath {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	agentRuntimeClasspath 'tools.jackson.core:jackson-databind'
	agentRuntimeClasspath 'jakarta.validation:jakarta.validation-api'
	agentRuntimeClasspath 'commons-io:commons-io:2.22.0'
}

tasks.register('agentJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
	dependsOn tasks.named('classes')
	archiveFileName.set('agent.jar')
	targetJavaVersion.set(JavaVersion.VERSION_25)
	mainClass.set('com.seshat.agent.AgentMain')
	classpath = configurations.agentRuntimeClasspath
	includeTools.set(false)
	layered {
		enabled.set(false)
	}

	bootInf {
		into('classes') {
			from(sourceSets.main.output.classesDirs) {
				include 'com/seshat/agent/**'
				include 'com/seshat/processing/**'
				include 'com/seshat/ingestion/dto/**'
				include 'com/seshat/control/dto/AgentControlMessages*.class'
				include 'com/seshat/monitoring/dto/AgentHeartbeatRequest.class'
			}
		}
	}

	manifest {
		attributes('Enable-Native-Access': 'ALL-UNNAMED')
	}
}
